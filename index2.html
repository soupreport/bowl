<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fill in the Blank</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: white;
    }

    .container {
      text-align: center;
      max-width: 600px;
    }

    .sentence {
      font-size: 2rem;
      line-height: 1.6;
      color: #333;
      margin-bottom: 2rem;
    }

    input[type="text"] {
      font-size: 2rem;
      border: none;
      border-bottom: 3px solid #667eea;
      padding: 0.5rem;
      text-align: center;
      outline: none;
      min-width: 200px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      border-bottom-color: #764ba2;
    }

    button {
      margin-top: 2rem;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-weight: 600;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    /* Thank you modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 3rem;
      border-radius: 20px;
      text-align: center;
      animation: slideUp 0.4s;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .modal-content h2 {
      color: #667eea;
      font-size: 2.5rem;
      margin: 0 0 1rem 0;
    }

    .modal-content p {
      color: #666;
      font-size: 1.2rem;
      margin: 0 0 2rem 0;
    }

    .close-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: #764ba2;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        transform: translateY(50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sentence">
      The soup today, <span id="currentDate" style="color: #667eea; font-weight: 600;"></span> , is
      <input type="text" id="userInput" placeholder="___________" maxlength="50">
    </div>
    <button onclick="submitAnswer()">Submit</button>
  </div>

  <!-- Thank You Modal -->
  <div class="modal" id="thankYouModal">
    <div class="modal-content">
      <h2>Thank You! 🎉</h2>
      <p>We appreciate you sharing that with us.</p>
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    // Set today's date
    function setDate() {
      const dateElement = document.getElementById('currentDate');
      const today = new Date();
      const options = { month: 'long', day: 'numeric', year: 'numeric' };
      dateElement.textContent = `(${today.toLocaleDateString('en-US', options)})`;
    }

    // Initialize date on load
    setDate();

    function submitAnswer() {
      const input = document.getElementById('userInput');
      const value = input.value.trim();
      
      if (value) {
        showThankYou();
      } else {
        // Shake animation if empty
        input.style.animation = 'shake 0.5s';
        setTimeout(() => {
          input.style.animation = '';
        }, 500);
      }
    }

    function showThankYou() {
      const modal = document.getElementById('thankYouModal');
      modal.classList.add('show');
    }

    function closeModal() {
      const modal = document.getElementById('thankYouModal');
      modal.classList.remove('show');
      // Optional: clear the input after closing
      // document.getElementById('userInput').value = '';
    }

    // Allow Enter key to submit
    document.getElementById('userInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        submitAnswer();
      }
    });

    // Add shake animation to CSS
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
