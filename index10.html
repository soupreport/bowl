<!DOCTYPE html>
<html>
<body>
  The soup today <span id="date"></span> is <input id="input"> <button onclick="submitSoup()">Submit</button>
  <div id="modal" style="display:none">Thank you</div>
  
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    const firebaseConfig = {
      apiKey: "AIzaSyCnlKKjIWXE2gDCdEe8NN2uDPWd3RF-upU",
      authDomain: "soup-report-with-claude.firebaseapp.com",
      projectId: "soup-report-with-claude",
      storageBucket: "soup-report-with-claude.firebasestorage.app",
      messagingSenderId: "798636211055",
      appId: "1:798636211055:web:f5cd6f84451a5efc98c69a",
      measurementId: "G-Q704Q3Z7HR"     
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    const today = new Date().toLocaleDateString('en-US', {month:'long',day:'numeric',year:'numeric'});
    document.getElementById('date').textContent = today;
    
    // Load existing soup for today
    const docRef = doc(db, 'soups', today);
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
      document.getElementById('input').value = docSnap.data().soup;
    }
    
    // Submit function
    window.submitSoup = async function() {
      const soup = document.getElementById('input').value;
      if(soup) {
        await setDoc(doc(db, 'soups', today), { soup: soup });
        document.getElementById('modal').style.display='block';
        setTimeout(() => document.getElementById('modal').style.display='none', 2000);
      }
    }
  </script>
</body>
</html>
