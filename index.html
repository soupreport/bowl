<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        height: 200vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
<div class="content">
  <p>Today’s soup is Tomato Bisque.</p>
  <a href="tel:+13055551234">📞 Call the kitchen</a>
</div>

<script>
  // Date
  document.getElementById("date").textContent =
    new Date().toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric"
    });

  // Soup
  fetch("./soup.json?v=" + Date.now())
    .then(res => res.json())
    .then(data => {
      document.getElementById("soup").textContent = data.soup;
    })
    .catch(() => {
      document.getElementById("soup").textContent = "Unknown";
    });
</script>

  </body>
</html>
