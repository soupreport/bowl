<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { 
      font-size: 18px; 
      font-family: system-ui, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    #modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #4CAF50;
      color: white;
      padding: 20px 40px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    #error {
      color: red;
      background: #ffebee;
      padding: 10px;
      border-radius: 4px;
      margin: 10px 0;
    }
    input {
      padding: 8px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin: 5px;
    }
    button {
      padding: 8px 16px;
      font-size: 16px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #1976D2;
    }
    .loading {
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="loading">Loading soup data...</div>
  
  The soup today, <span id="date"></span>, is <span id="soupDisplay"></span><span id="restaurantDisplay"></span>
  
  <div id="error" style="display:none"></div>
  
  <div id="mainInputs">
    <input id="soupInput" placeholder="soup?"> at <input id="restaurantInput" placeholder="where?">
  </div>
  
  <span id="mainOrder" style="display:none">
    <a href="https://www.doordash.com" target="_blank"><button>Order</button></a>
  </span>
  
  <div id="maybeContainer" style="display:none">
    <button id="maybeBtn">or maybe it's</button>
  </div>
  
  <div id="modal" style="display:none">Thank you</div>
  <div id="alternatives"></div>
  
  <script type="module">
    try {
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
      import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
   
      const firebaseConfig = {
        apiKey: "AIzaSyC3C35LCTnyc7j1TyZkl0hwW4Bnnlazv5s",
        authDomain: "soup-report-with-claude.firebaseapp.com",
        projectId: "soup-report-with-claude",
        storageBucket: "soup-report-with-claude.firebasestorage.app",
        messagingSenderId: "798636211055",
        appId: "1:798636211055:web:f5cd6f84451a5efc98c69a",
        measurementId: "G-Q704Q3Z7HR"  
      }; 

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      
      const today = new Date().toLocaleDateString('en-US', {month:'long',day:'numeric',year:'numeric'});
      document.getElementById('date').textContent = today;
      
      // Remove loading message
      document.querySelector('.loading').remove();
      
      // Load existing soup
      const docRef = doc(db, 'soups', today);
      const docSnap = await getDoc(docRef);
      
      if (docSnap.exists()) {
        const data = docSnap.data();
        document.getElementById('soupDisplay').textContent = data.soup;
        document.getElementById('restaurantDisplay').textContent = data.restaurant ? ' at ' + data.restaurant + '.' : '.';
        document.getElementById('mainInputs').style.display = 'none';
        document.getElementById('mainOrder').style.display = 'inline';
        document.getElementById('maybeContainer').style.display = 'inline';
        if (data.alternatives) {
          data.alternatives.forEach(alt => {
            const altText = alt.restaurant ? alt.soup + ' at ' + alt.restaurant + '.' : alt.soup + '.';
            document.getElementById('alternatives').innerHTML += '<br>or maybe it\'s ' + altText + ' <a href="https://www.doordash.com" target="_blank"><button>Order</button></a>';
          });
        }
      } else {
        document.getElementById('soupDisplay').textContent = '???';
        document.getElementById('restaurantDisplay').textContent = '';
      }
      
      // Submit main soup on Enter
      document.getElementById('soupInput').addEventListener('keypress', async function(e) {
        if(e.key === 'Enter') submitMain();
      });
      document.getElementById('restaurantInput').addEventListener('keypress', async function(e) {
        if(e.key === 'Enter') submitMain();
      });
      
      async function submitMain() {
        const soup = document.getElementById('soupInput').value;
        const restaurant = document.getElementById('restaurantInput').value;
        if(soup) {
          try {
            await setDoc(doc(db, 'soups', today), { soup: soup, restaurant: restaurant || '', alternatives: [] });
            document.getElementById('soupDisplay').textContent = soup;
            document.getElementById('restaurantDisplay').textContent = restaurant ? ' at ' + restaurant + '.' : '.';
            document.getElementById('mainInputs').style.display = 'none';
            document.getElementById('mainOrder').style.display = 'inline';
            document.getElementById('maybeContainer').style.display = 'inline';
            document.getElementById('modal').style.display='block';
            setTimeout(() => document.getElementById('modal').style.display='none', 2000);
          } catch(err) {
            document.getElementById('error').textContent = 'Error saving: ' + err.message;
            document.getElementById('error').style.display = 'block';
          }
        }
      }
      
      // Add another line
      document.getElementById('maybeBtn').addEventListener('click', function() {
        const newLine = document.createElement('div');
        newLine.innerHTML = '<br>or maybe it\'s <input class="altSoup" placeholder="soup?"> at <input class="altRestaurant" placeholder="I\'m not telling">';
        
        document.getElementById('alternatives').appendChild(newLine);
        
        const altSoupInputs = newLine.querySelectorAll('.altSoup, .altRestaurant');
        altSoupInputs.forEach(input => {
          input.addEventListener('keypress', async function(e) {
            if(e.key === 'Enter') {
              const soupInput = newLine.querySelector('.altSoup');
              const restaurantInput = newLine.querySelector('.altRestaurant');
              const soup = soupInput.value;
              const restaurant = restaurantInput.value;
              if(soup) {
                try {
                  await updateDoc(doc(db, 'soups', today), {
                    alternatives: arrayUnion({soup: soup, restaurant: restaurant || ''})
                  });
                  const altText = restaurant ? soup + ' at ' + restaurant + '.' : soup + '.';
                  newLine.innerHTML = '<br>or maybe it\'s ' + altText + ' <a href="https://www.doordash.com" target="_blank"><button>Order</button></a>';
                  
                  document.getElementById('modal').style.display='block';
                  setTimeout(() => document.getElementById('modal').style.display='none', 2000);
                  
                  const maybeContainer = document.getElementById('maybeContainer');
                  document.body.appendChild(maybeContainer);
                } catch(err) {
                  document.getElementById('error').textContent = 'Error saving alternative: ' + err.message;
                  document.getElementById('error').style.display = 'block';
                }
              }
            }
          });
        });
      });
      
    } catch(err) {
      document.querySelector('.loading')?.remove();
      document.getElementById('error').textContent = 'Failed to load Firebase: ' + err.message + '. Check console for details.';
      document.getElementById('error').style.display = 'block';
      console.error('Firebase error:', err);
    }
  </script>
</body>
</html>
