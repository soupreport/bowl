<!DOCTYPE html>
<html>
<body>
  The soup today <span id="date"></span> is <input id="input"> 
  <button id="submitBtn">Submit</button>
  <div id="afterSubmit" style="display:none">
    <button id="maybeBtn">or maybe it's</button>
    <a href="https://www.doordash.com" target="_blank"><button>Order</button></a>
  </div>
  <div id="modal" style="display:none">Thank you</div>
  <div id="alternatives"></div>
  
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // REPLACE THIS with your Firebase config from Firebase Console
    const firebaseConfig = {
      apiKey: "AIzaSyCnlKKjIWXE2gDCdEe8NN2uDPWd3RF-upU",
      authDomain: "soup-report-with-claude.firebaseapp.com",
      projectId: "soup-report-with-claude",
      storageBucket: "soup-report-with-claude.firebasestorage.app",
      messagingSenderId: "798636211055",
      appId: "1:798636211055:web:f5cd6f84451a5efc98c69a",
      measurementId: "G-Q704Q3Z7HR"  
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    const today = new Date().toLocaleDateString('en-US', {month:'long',day:'numeric',year:'numeric'});
    document.getElementById('date').textContent = today;
    
    // Load existing soup for today
    const docRef = doc(db, 'soups', today);
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
      const data = docSnap.data();
      document.getElementById('input').value = data.soup;
      document.getElementById('submitBtn').style.display = 'none';
      document.getElementById('afterSubmit').style.display = 'inline';
      if (data.alternatives) {
        data.alternatives.forEach(alt => {
          document.getElementById('alternatives').innerHTML += '<br>or maybe it\'s ' + alt;
        });
      }
    }
    
    // Submit button click handler
    document.getElementById('submitBtn').addEventListener('click', async function() {
      const soup = document.getElementById('input').value;
      if(soup) {
        await setDoc(doc(db, 'soups', today), { soup: soup, alternatives: [] });
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('afterSubmit').style.display = 'inline';
        document.getElementById('modal').style.display='block';
        setTimeout(() => document.getElementById('modal').style.display='none', 2000);
      }
    });
    
    // Add another soup option
    document.getElementById('maybeBtn').addEventListener('click', async function() {
      const newSoup = prompt("What else might it be?");
      if(newSoup) {
        await updateDoc(doc(db, 'soups', today), {
          alternatives: arrayUnion(newSoup)
        });
        document.getElementById('alternatives').innerHTML += '<br>or maybe it\'s ' + newSoup;
      }
    });
  </script>
</body>
</html>
